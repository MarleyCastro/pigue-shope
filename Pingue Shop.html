<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pingue Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0D47A1;--yellow:#FFC107;--ink:#0b2a5b;--soft:#F2F6FB;--line:#d5deea;--muted:#5d6f8a;--red:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#fff;font-family:'Outfit',system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;overflow:hidden}
button{font:inherit;color:inherit}
.app{height:100%;aspect-ratio:9/19.5;max-width:100%;background:#fff;position:relative;overflow:hidden}
.s{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s;opacity:0;pointer-events:none}
.s.active{transform:none;opacity:1;pointer-events:auto}
.s.out-l{transform:translateX(-28%);opacity:0}
.s.out-r{transform:translateX(100%);opacity:0}
.s.in-l{transform:translateX(-28%);opacity:0;transition:none}
.s.in-r{transform:translateX(100%);opacity:1;transition:none}
#splash{background:var(--blue);align-items:center;justify-content:center;color:#fff;gap:14px;transform:none}
#splash:not(.active){opacity:0}
#splash svg{animation:pop .8s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
#splash h1{font-size:30px;font-weight:700}
#splash h1 span{font-weight:400}
.bar{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;width:0;background:var(--yellow);animation:load 2s linear forwards}
@keyframes load{to{width:100%}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:18px 18px 12px}
.top h2{font-size:20px;font-weight:700}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;color:var(--blue);margin-right:auto}
.acts{display:flex;gap:8px}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--soft);color:var(--blue);display:grid;place-items:center;cursor:pointer;position:relative;transition:transform .15s}
.ib:active{transform:scale(.92)}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--yellow);color:#1b2a44;font-size:11px;font-weight:700;display:grid;place-items:center;transform:scale(0);transition:transform .25s cubic-bezier(.2,.9,.3,1.4)}
.badge.on{transform:scale(1)}
:is(.ib,.btn,.card,.m,.pay,.q,.drop,.rm):focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:4px 18px 18px;overflow:auto;flex:1;align-content:start}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .img{aspect-ratio:1;border-radius:12px;background:var(--soft);overflow:hidden;margin-bottom:8px}
.pimg{width:100%;height:100%;display:block;object-fit:cover}
.pimg.ct{object-fit:contain;mix-blend-mode:multiply}
.foot .note{margin-bottom:8px}
.card b{display:block;font-size:15px;font-weight:600}
.card span{font-size:14px;color:var(--blue);font-weight:600}
.btn{border:0;border-radius:14px;padding:15px;font-weight:600;font-size:16px;cursor:pointer;background:var(--blue);color:#fff;transition:transform .15s;width:100%}
.btn:active{transform:scale(.97)}
.btn.y{background:var(--yellow);color:#1b2a44}
.body{padding:6px 18px 20px;display:flex;flex-direction:column;gap:14px;flex:1;overflow:auto}
label{font-size:14px;font-weight:600;display:block;margin-bottom:6px}
input[type=text],input:not([type]){width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);font:inherit;color:var(--ink);background:#fff}
input:focus{outline:0;border-color:var(--blue)}
.drop{border:2px dashed var(--blue);background:var(--soft);color:var(--blue);border-radius:16px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;cursor:pointer;transition:background .2s,border-color .2s;width:100%;flex:none}
.drop .t{font-size:26px}
.drop small{font-weight:400;color:var(--muted);font-size:13px}
@media (hover:none){.drop small.dd{display:none}}
#sell.drag .drop{background:#FFF3C4;border-color:var(--yellow)}
.note{font-size:13px;color:var(--red);min-height:0}
.pv-h{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.pv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{aspect-ratio:1;border-radius:12px;position:relative;overflow:hidden;background:var(--soft)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.rm{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(11,42,91,.82);color:#fff;font-size:13px;cursor:pointer;display:grid;place-items:center}
.foot{padding:12px 18px 20px}
.center{align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px;flex:1;display:flex;flex-direction:column}
.check{width:96px;height:96px;border-radius:50%;background:var(--yellow);display:grid;place-items:center}
.check path{stroke-dasharray:40;stroke-dashoffset:40}
.active .check path{animation:draw .6s .35s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.center h2{font-size:24px;line-height:1.2}
.center p{color:var(--muted);font-size:15px}
.ord{background:var(--soft);border-radius:12px;padding:10px 18px;font-weight:600;color:var(--blue)}
.stat{background:var(--soft);border-radius:18px;padding:18px;display:flex;justify-content:space-between;align-items:center}
.stat b{font-size:26px;color:var(--blue)}
.stat.hl{background:var(--blue);color:#fff}.stat.hl b{color:var(--yellow)}
.big{height:min(260px,34vh);margin:0 18px;border-radius:12px;background:var(--soft);overflow:hidden}
.pr{font-size:28px;font-weight:700;color:var(--blue)}
.nm{font-size:18px;font-weight:500}
.item{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.item .tn{width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--soft);flex:none}
.item .in{flex:1;min-width:0}
.item b{display:block;font-weight:600}
.item span{color:var(--blue);font-weight:600;font-size:14px}
.qty{display:flex;align-items:center;gap:8px;font-weight:600}
.q{width:30px;height:30px;border-radius:8px;border:0;background:var(--soft);color:var(--blue);font-size:18px;cursor:pointer}
.sum{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.sum div{display:flex;justify-content:space-between;color:var(--muted)}
.sum .tot{color:var(--ink);font-size:20px;font-weight:700;padding-top:10px;border-top:1px solid var(--line)}
.sum .tot b{color:var(--blue)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.pay{display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;text-align:left;font-weight:600;font-size:16px;width:100%;transition:border-color .2s,background .2s}
.pay small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.pay .ic{font-size:24px}
.pay[aria-checked="true"]{border-color:var(--blue);background:var(--soft)}
.pay::after{content:"";margin-left:auto;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.pay[aria-checked="true"]::after{border:6px solid var(--blue)}
#ov{position:absolute;inset:0;z-index:5;background:rgba(8,24,56,.5);opacity:0;pointer-events:none;transition:opacity .3s;display:flex;align-items:flex-end}
#ov.open{opacity:1;pointer-events:auto}
.sheet{width:100%;background:#fff;border-radius:28px 28px 0 0;padding:14px 18px 24px;display:flex;flex-direction:column;gap:10px;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#ov.open .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 4px}
.hd{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:18px}
.m{border:0;border-radius:14px;padding:16px;font-weight:600;font-size:17px;cursor:pointer;background:var(--soft);color:var(--blue);transition:transform .15s}
.m.p{background:var(--blue);color:#fff}
.m:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="app">

<section class="s active" id="splash" aria-label="Carregando">
  <svg width="110" height="110" viewBox="0 0 110 110" fill="none"><path d="M18 62c0-24 18-40 40-40 10 0 18 3 24 8-1 7-6 11-12 13 14 6 22 18 22 32 0 20-18 31-34 31-26 0-40-18-40-44z" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><circle cx="48" cy="48" r="9" stroke="#FFC107" stroke-width="5"/><path d="M42 66c10 2 18 10 18 22-12-2-20-10-18-22z" fill="#FFC107"/></svg>
  <h1>Pingue <span>Shop</span></h1>
  <div class="bar"><i></i></div>
</section>

<section class="s" id="home">
  <div class="top">
    <div class="brand"><svg width="26" height="26" viewBox="0 0 110 110" fill="none"><path d="M18 62c0-24 18-40 40-40 10 0 18 3 24 8-1 7-6 11-12 13 14 6 22 18 22 32 0 20-18 31-34 31-26 0-40-18-40-44z" stroke="#0D47A1" stroke-width="9" stroke-linejoin="round"/><path d="M42 66c10 2 18 10 18 22-12-2-20-10-18-22z" fill="#FFC107"/></svg>Pingue Shop</div>
    <div class="acts">
      <button class="ib" id="cartBtn" aria-label="Abrir carrinho"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.5 12.5h11L21 7H6"/></svg><span class="badge" id="badge">0</span></button>
      <button class="ib" id="menuBtn" aria-label="Abrir menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</section>

<section class="s" id="detail">
  <div class="top"><h2>Produto</h2><button class="ib" data-back aria-label="Voltar">←</button></div>
  <div class="big" id="dImg"></div>
  <div class="body"><div class="pr" id="dPr"></div><div class="nm" id="dNm"></div></div>
  <div class="foot"><button class="btn y" id="buy">Comprar</button></div>
</section>

<section class="s" id="cart">
  <div class="top"><h2>Carrinho</h2><button class="ib" data-back aria-label="Voltar">←</button></div>
  <div class="body" id="cartBody"></div>
  <div class="foot"><button class="btn y" id="toPay">Ir para o Pagamento</button></div>
</section>

<section class="s" id="payment">
  <div class="top"><h2>Pagamento</h2><button class="ib" data-back aria-label="Voltar">←</button></div>
  <div class="body" role="radiogroup" aria-label="Método de pagamento">
    <button class="pay" role="radio" aria-checked="true" data-pay="PIX"><span class="ic">⚡</span><span>PIX<small>Aprovação imediata</small></span></button>
    <button class="pay" role="radio" aria-checked="false" data-pay="Cartão de Crédito"><span class="ic">💳</span><span>Cartão de Crédito<small>Em até 3x sem juros</small></span></button>
    <button class="pay" role="radio" aria-checked="false" data-pay="Boleto"><span class="ic">🧾</span><span>Boleto<small>Vence em 3 dias úteis</small></span></button>
    <div class="sum"><div class="tot"><span>Total</span><b id="payTot"></b></div></div>
  </div>
  <div class="foot"><button class="btn" id="confirmPay">Confirmar pagamento</button></div>
</section>

<section class="s" id="confirm">
  <div class="center">
    <div class="check"><svg width="52" height="52" viewBox="0 0 52 52" fill="none"><path d="M13 27l9 9 17-19" stroke="#0D47A1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2>Produto Confirmado com Sucesso!!</h2>
    <div class="ord" id="ordNum"></div>
    <p id="cMsg"></p>
  </div>
  <div class="foot"><button class="btn" id="toHome">Voltar ao início</button></div>
</section>

<section class="s" id="sell">
  <div class="top"><h2>Vender</h2><button class="ib" data-back aria-label="Fechar">✕</button></div>
  <div class="body">
    <button class="drop" id="dropBtn" type="button"><span class="t">📷</span><span>Inserir Fotos</span><small>.jpg, .png ou .webp</small><small class="dd">ou arraste as fotos até aqui</small></button>
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" multiple hidden>
    <div class="note" id="note" role="status" aria-live="polite"></div>
    <div id="pvWrap" hidden>
      <div class="pv-h"><span id="pvCount"></span></div>
      <div class="pv" id="pv" style="margin-top:8px"></div>
    </div>
    <div><label for="nome">Nome</label><input id="nome" type="text" placeholder="Ex.: Óculos de sol"></div>
    <div><label for="preco">Preço</label><input id="preco" type="text" inputmode="decimal" placeholder="R$ 0,00"></div>
  </div>
  <div class="foot"><div class="note" id="formErr" role="alert"></div><button class="btn" id="ok">OK</button></div>
</section>

<section class="s" id="status">
  <div class="top"><h2>STATUS</h2><button class="ib" data-back aria-label="Fechar">✕</button></div>
  <div class="body">
    <div class="stat"><span>Produtos Anunciados</span><b>10</b></div>
    <div class="stat"><span>Vendas</span><b>5</b></div>
    <div class="stat hl"><span>Saldo</span><b>R$ 100,00</b></div>
  </div>
</section>

<div id="ov" aria-hidden="true">
  <div class="sheet" role="dialog" aria-label="Menu">
    <div class="grab"></div>
    <div class="hd">Menu<button class="ib" id="closeMenu" aria-label="Fechar menu">✕</button></div>
    <button class="m p" data-go="sell">Vender</button>
    <button class="m" data-go="home">Comprar</button>
    <button class="m" data-go="status">STATUS</button>
  </div>
</div>
</div>

const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let P=[{id:1,name:"Mochila",price:89,img:IMG.mochila,ct:1},{id:2,name:"Fone",price:59.9,img:IMG.fone,ct:1},{id:3,name:"Relógio",price:120,img:IMG.relogio,ct:1},{id:4,name:"Bicicleta",price:450,img:IMG.bike,ct:1},{id:5,name:"Tênis",price:110,img:IMG.tenis,ct:1},{id:6,name:"Celular",price:800,img:IMG.celular,ct:1}],nextId=100;
const byId=id=>P.find(p=>p.id==id);
const pic=p=>`<img class="pimg${p.ct?" ct":""}" src="${p.img}" alt="${esc(p.name)}">`;
function parsePrice(s){s=s.replace(/[^\d,.]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");const n=parseFloat(s);return isFinite(n)?n:0}
const tint=["#FFF3C4","#DCE8FA","#FFE7A3","#C9DBF5"];
const T=i=>tint[i%4],FRETE=15,MAXF=8,OK_T=["image/jpeg","image/png","image/webp"];
let cur="splash",stack=[],busy=false,cart={},pick=0,method="PIX",photos=[],pid=0;

function renderGrid(){$("grid").innerHTML=P.map(p=>`<button class="card" data-id="${p.id}"><div class="img">${pic(p)}</div><b>${esc(p.name)}</b><span>${R(p.price)}</span></button>`).join("")}
renderGrid();

function go(to,back){
  if(to===cur||busy)return;busy=true;
  const a=$(cur),b=$(to);
  if(!back)stack.push(cur);
  b.className="s "+(back?"in-l":"in-r");void b.offsetWidth;
  b.className="s active";
  a.className="s "+(back?"out-r":"out-l");
  cur=to;setTimeout(()=>{busy=false},380);
}
function back(){if(stack.length)go(stack.pop(),true)}
function menu(o){$("ov").classList.toggle("open",o);$("ov").setAttribute("aria-hidden",!o)}
const ids=()=>Object.keys(cart);
const sub=()=>ids().reduce((s,i)=>s+byId(i).price*cart[i],0);
const total=()=>sub()+(ids().length?FRETE:0);

function render(){
  const n=ids().reduce((s,i)=>s+cart[i],0);
  $("badge").textContent=n;$("badge").classList.toggle("on",n>0);
  $("cartBtn").setAttribute("aria-label","Abrir carrinho, "+n+" item(ns)");
  $("cartBody").innerHTML=ids().length?
    ids().map(i=>{const p=byId(i);return `<div class="item"><div class="tn">${pic(p)}</div><div class="in"><b>${esc(p.name)}</b><span>${R(p.price)}</span></div><div class="qty"><button class="q" data-d="-1" data-i="${i}" aria-label="Diminuir">−</button>${cart[i]}<button class="q" data-d="1" data-i="${i}" aria-label="Aumentar">+</button></div></div>`}).join("")+
    `<div class="sum"><div><span>Subtotal</span><span>${R(sub())}</span></div><div><span>Frete</span><span>${R(FRETE)}</span></div><div class="tot"><span>Total</span><b>${R(total())}</b></div></div>`
    :`<div class="empty">Seu carrinho está vazio.<br>Escolha um produto para começar.</div>`;
  $("toPay").style.opacity=ids().length?1:.5;
  $("payTot").textContent=R(total());
}

/* ---- Upload de fotos ---- */
function renderPv(){
  $("pvWrap").hidden=!photos.length;
  $("pvCount").textContent=photos.length+(photos.length===1?" foto selecionada":" fotos selecionadas");
  $("pv").innerHTML=photos.map(p=>`<div class="th"><img src="${p.src}" alt="${p.name.replace(/"/g,"")}"><button class="rm" type="button" data-id="${p.id}" aria-label="Remover foto">✕</button></div>`).join("");
}
function addFiles(list){
  const files=[...list];let msg="";
  const good=files.filter(f=>OK_T.includes(f.type));
  if(good.length<files.length)msg="Alguns arquivos foram ignorados. Use .jpg, .png ou .webp.";
  const room=MAXF-photos.length;
  if(good.length>room){msg=`Limite de ${MAXF} fotos por produto.`}
  good.slice(0,Math.max(room,0)).forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{photos.push({id:++pid,name:f.name,src:r.result});renderPv()};
    r.readAsDataURL(f);
  });
  $("note").textContent=msg;
}
$("dropBtn").onclick=()=>$("file").click();
$("file").onchange=e=>{addFiles(e.target.files);e.target.value=""};
$("pv").onclick=e=>{const b=e.target.closest(".rm");if(!b)return;photos=photos.filter(p=>p.id!==+b.dataset.id);$("note").textContent="";renderPv()};
["dragover","drop"].forEach(t=>window.addEventListener(t,e=>e.preventDefault()));
const sell=$("sell");let dc=0;
sell.addEventListener("dragenter",e=>{e.preventDefault();dc++;sell.classList.add("drag")});
sell.addEventListener("dragleave",()=>{dc=Math.max(0,dc-1);if(!dc)sell.classList.remove("drag")});
sell.addEventListener("drop",e=>{e.preventDefault();dc=0;sell.classList.remove("drag");if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files)});

/* ---- Navegação e compra ---- */
setTimeout(()=>{stack=[];go("home");stack=[]},2000);
$("menuBtn").onclick=()=>menu(true);
$("closeMenu").onclick=()=>menu(false);
$("ov").onclick=e=>{if(e.target.id==="ov")menu(false)};
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{menu(false);const t=b.dataset.go;if(t!=="home")go(t)});
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=back);
$("cartBtn").onclick=()=>go("cart");
$("grid").onclick=e=>{const c=e.target.closest(".card");if(!c)return;pick=+c.dataset.id;const p=byId(pick);$("dImg").innerHTML=pic(p);$("dNm").textContent=p.name;$("dPr").textContent=R(p.price);go("detail")};
$("buy").onclick=()=>{cart[pick]=(cart[pick]||0)+1;render();go("cart")};
$("cartBody").onclick=e=>{const q=e.target.closest(".q");if(!q)return;const i=q.dataset.i;cart[i]+=+q.dataset.d;if(cart[i]<1)delete cart[i];render()};
$("toPay").onclick=()=>{if(ids().length)go("payment")};
document.querySelectorAll(".pay").forEach(b=>b.onclick=()=>{method=b.dataset.pay;document.querySelectorAll(".pay").forEach(x=>x.setAttribute("aria-checked",x===b))});
$("confirmPay").onclick=()=>{
  $("ordNum").textContent="Pedido #PS-"+Math.floor(100000+Math.random()*900000);$("ordNum").hidden=false;
  $("cMsg").textContent="Pagamento via "+method+" de "+R(total())+" recebido.";
  cart={};render();go("confirm");
};
$("ok").onclick=()=>{
  const nome=$("nome").value.trim(),preco=parsePrice($("preco").value);
  const err=!photos.length?"Adicione pelo menos uma foto.":!nome?"Informe o nome do produto.":preco<=0?"Informe um preço válido.":"";
  $("formErr").textContent=err;if(err)return;
  P.unshift({id:++nextId,name:nome,price:preco,img:photos[0].src});renderGrid();
  $("ordNum").hidden=true;
  $("cMsg").textContent="“"+nome+"” já está na lista principal do Pingue Shop.";
  photos=[];renderPv();$("nome").value="";$("preco").value="";$("note").textContent="";
  go("confirm");
};
$("toHome").onclick=()=>{$("grid").scrollTop=0;stack=[];go("home");stack=[]};
render();
</script>
